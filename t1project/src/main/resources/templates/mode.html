<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <title>モード選択</title>
</head>

<body>
  <main>
    <h1>モード選択</h1>

    <p>
      ログイン中:
      <span sec:authentication="name"></span>
    </p>

    <nav aria-label="メニュー">
      <ul>
        <li>
          <a th:href="@{/game}">人対人</a>
        </li>
        <li>
          <button type="button" disabled>人対CPU</button>
        </li>
        <li>
          <a th:href="@{/results}">試合結果</a>
        </li>
      </ul>
    </nav>

    <form th:action="@{/logout}" method="post">
      <button type="submit">ログアウト</button>
    </form>
  </main>
</body>

</html>
