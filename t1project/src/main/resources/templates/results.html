<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>過去の試合結果</title>
</head>

<body>
  <main>
    <h1>過去の試合結果</h1>
    <p th:if="${results.isEmpty()}">過去の試合結果はありません。</p>
    <ul th:unless="${results.isEmpty()}">
      <li th:each="result : ${results}">
        <a th:href="@{/result(matchId=${result.matchId})}">
          <span th:text="${result.firstPlayer}"></span>
          対
          <span th:text="${result.secondPlayer}"></span>
          （勝者: <span th:text="${result.winner}"></span>）
        </a>
      </li>
    </ul>
    <a th:href="@{/mode}">モード選択に戻る</a>
  </main>
</body>

</html>
